[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentjanitor"
version = "0.1.0"
description = "Clean up orphaned processes, bloated sessions, leaked credentials & broken MCP servers left by Claude Code, Codex, Cursor & Gemini CLI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Tugra Kaymakcioglu" },
    { name = "AgentJanitor contributors" }
]
keywords = [
    "ai-agents",
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "claude-code",
    "codex",
    "cursor",
    "gemini-cli",
    "developer-tools",
    "ai-coding-assistant",
    "diagnostics",
    "cleanup",
    "process-manager",
    "memory-leak",
    "credential-hygiene",
    "cli",
    "terminal",
    "python",
    "antigravity",
    "aider"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.5",
    "rich>=13.8.0",
    "pydantic>=2.9.0",
    "psutil>=6.0.0",
    "platformdirs>=4.3.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/tugrakaymakcioglu/AgentJanitor"
Repository = "https://github.com/tugrakaymakcioglu/AgentJanitor.git"
Issues = "https://github.com/tugrakaymakcioglu/AgentJanitor/issues"
Changelog = "https://github.com/tugrakaymakcioglu/AgentJanitor/blob/main/CHANGELOG.md"

[project.scripts]
agentjanitor = "agentjanitor.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentjanitor"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
